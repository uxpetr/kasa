name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://kasa:kasa@localhost:5432/kasa
      S3_ENDPOINT: http://localhost:8333
      S3_REGION: us-east-1
      S3_BUCKET: kasa-media
      S3_ACCESS_KEY_ID: kasa-dev
      S3_SECRET_ACCESS_KEY: kasa-dev-secret
      S3_FORCE_PATH_STYLE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Same Postgres and S3 as local development (docker-compose.yml).
      - run: pnpm services
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Migrations match the schema
        run: |
          pnpm db:generate
          test -z "$(git status --porcelain packages/db/migrations)" || { echo "Schema changed without a migration. Run pnpm db:generate and commit it."; git status --porcelain packages/db/migrations; exit 1; }
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://kasa:kasa@localhost:5432/kasa
      S3_ENDPOINT: http://localhost:8333
      S3_REGION: us-east-1
      S3_BUCKET: kasa-media
      S3_ACCESS_KEY_ID: kasa-dev
      S3_SECRET_ACCESS_KEY: kasa-dev-secret
      S3_FORCE_PATH_STYLE: "true"
      # CI-only values: the e2e tests stub Google, so no real client is needed.
      BETTER_AUTH_SECRET: ci-only-secret-0123456789abcdef0123456789
      GOOGLE_CLIENT_ID: ci-dummy-client.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: ci-dummy-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Same Postgres and S3 as local development (docker-compose.yml).
      - run: pnpm services
      - run: pnpm --filter @kasa/web exec playwright install --with-deps chromium
      - run: pnpm db:migrate
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
